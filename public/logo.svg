<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <!-- Radiant gold-saffron gradients -->
    <linearGradient id="ganeshaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="25%" stop-color="#F57C00" />
      <stop offset="70%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <linearGradient id="ganeshaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="40%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Top curved text arc -->
    <path id="topTextArc" d="M 180,500 A 345,345 0 0,1 820,500" fill="none" />
    <!-- Bottom curved text arc -->
    <path id="bottomTextArc" d="M 140,510 A 390,390 0 0,0 860,510" fill="none" />
  </defs>

  <!-- Outer background circle in rich orange -->
  <circle cx="500" cy="500" r="494" fill="#F07116" />

  <!-- Inner cream badge following 16 scalloped arches -->
  <path d="M 500.0,20.0 A 135 135 0 0 0 683.7 56.5 A 135 135 0 0 0 839.4 160.6 A 135 135 0 0 0 943.5 316.3 A 135 135 0 0 0 980.0 500.0 A 135 135 0 0 0 943.5 683.7 A 135 135 0 0 0 839.4 839.4 A 135 135 0 0 0 683.7 943.5 A 135 135 0 0 0 500.0 980.0 A 135 135 0 0 0 316.3 943.5 A 135 135 0 0 0 160.6 839.4 A 135 135 0 0 0 56.5 683.7 A 135 135 0 0 0 20.0 500.0 A 135 135 0 0 0 56.5 316.3 A 135 135 0 0 0 160.6 160.6 A 135 135 0 0 0 316.3 56.5 A 135 135 0 0 0 500.0 20.0 Z" fill="#FFF4DD" stroke="#F07116" stroke-width="5" stroke-linejoin="round" />

  <!-- Top Curved Brand Text: PUJA SATHI -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#E65100" letter-spacing="12">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      PUJA SATHI
    </textPath>
  </text>

  <!-- Bottom Curved Tagline: SOLUTION FOR YOUR PUJA -->
  <text font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#E65100" letter-spacing="10">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      SOLUTION FOR YOUR PUJA
    </textPath>
  </text>

  <!-- CENTER LOGO ARTWORK: LORD GANESHA WITH SACRED OM -->
  <g transform="translate(500, 490) scale(1.72) translate(-125, -125)">
    <!-- 1. MUKUT / CROWN (Top) -->
    <!-- Top finial flame -->
    <path d="M 125,44 C 122,30 115,18 125,4 C 135,18 128,30 125,44 Z" fill="url(#ganeshaOrange)" />
    <path d="M 125,38 C 122,28 119,20 125,10 C 131,20 128,28 125,38 Z" fill="url(#ganeshaGold)" />
    <!-- 3 Ribbed Tiers -->
    <path d="M 112,48 Q 125,42 138,48" fill="none" stroke="url(#ganeshaOrange)" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 114,48 Q 125,43 136,48" fill="none" stroke="url(#ganeshaGold)" stroke-width="2.8" stroke-linecap="round" />

    <path d="M 115,57 Q 125,52 135,57" fill="none" stroke="url(#ganeshaOrange)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 117,57 Q 125,53 133,57" fill="none" stroke="url(#ganeshaGold)" stroke-width="2.4" stroke-linecap="round" />

    <path d="M 118,65 Q 125,61 132,65" fill="none" stroke="url(#ganeshaOrange)" stroke-width="5" stroke-linecap="round" />

    <!-- 2. LEFT EAR & HEAD PROFILE (Sweeping spiral ear) -->
    <path d="M 115,70 C 88,64 64,85 62,112 C 60,136 76,152 88,154 C 93,154 94,148 90,145 C 78,140 72,128 73,114 C 75,96 89,82 110,82"
          fill="none" stroke="url(#ganeshaOrange)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 113,71 C 89,66 67,86 65,112 C 63,134 78,148 88,150"
          fill="none" stroke="url(#ganeshaGold)" stroke-width="5" stroke-linecap="round" />

    <!-- 3. FOREHEAD, BROW, EYE, TUSK -->
    <path d="M 119,84 C 124,86 131,94 133,105 C 135,114 130,120 126,122" fill="none" stroke="url(#ganeshaOrange)" stroke-width="7" stroke-linecap="round" />
    <path d="M 120,85 C 124,87 130,94 132,103" fill="none" stroke="url(#ganeshaGold)" stroke-width="3" stroke-linecap="round" />

    <!-- Almond Eye -->
    <path d="M 123,99 C 128,102 130,107 129,112 C 126,111 123,107 121,102 Z" fill="#E65100" />
    <circle cx="125" cy="104" r="1.2" fill="#FFF4DD" />

    <!-- Small Ganesha tusk -->
    <path d="M 112,136 C 117,140 122,142 126,142 C 121,145 115,144 110,140 Z" fill="url(#ganeshaOrange)" />

    <!-- 4. FLOWING TRUNK (Descending, sweeping curve, curling up at bottom into swirl) -->
    <path d="M 125,122 C 124,146 106,166 104,194 C 101,226 122,244 146,240 C 168,236 174,214 162,198 C 150,184 134,192 134,206 C 134,216 144,220 148,215 C 151,211 148,206 143,206"
          fill="none" stroke="url(#ganeshaOrange)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Yellow luminous core of trunk -->
    <path d="M 125,127 C 124,149 108,168 106,194 C 104,222 122,237 144,234 C 162,231 167,214 158,202 C 150,192 138,198 138,206"
          fill="none" stroke="url(#ganeshaGold)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 5. LOWER LEFT BODY / OM BASE LOOP -->
    <path d="M 88,158 C 58,168 46,194 54,222 C 64,254 96,268 134,262 C 170,256 186,238 190,220 C 191,214 184,212 180,216 C 172,228 156,244 130,247 C 100,251 76,238 70,218 C 63,196 73,178 90,168 C 96,164 94,156 88,158 Z"
          fill="url(#ganeshaOrange)" />
    <!-- Inner yellow highlight on body loop -->
    <path d="M 58,218 C 66,244 94,256 128,253 C 156,250 174,236 182,224"
          fill="none" stroke="url(#ganeshaGold)" stroke-width="4.5" stroke-linecap="round" />

    <!-- 6. SACRED OM CALLIGRAPHIC RIGHT SIDE (Upper & Lower Lobes of ॐ) -->
    <!-- Upper right lobe & lower right lobe of Om -->
    <path d="M 148,114 C 174,114 198,130 196,158 C 194,182 172,200 152,201 C 168,204 190,218 188,242 C 186,266 160,280 130,280 C 120,280 116,270 126,268 C 150,264 172,252 174,234 C 176,216 156,208 140,208 C 134,208 134,200 140,200 C 158,200 178,190 180,166 C 182,142 164,128 144,128 C 136,128 138,114 148,114 Z"
          fill="url(#ganeshaOrange)" />
    <!-- Inner gold highlight on upper Om lobe -->
    <path d="M 150,122 C 168,122 184,134 183,156 C 182,174 168,188 152,192"
          fill="none" stroke="url(#ganeshaGold)" stroke-width="4.2" stroke-linecap="round" />
    <!-- Inner gold highlight on lower Om lobe -->
    <path d="M 154,208 C 172,212 178,226 176,240 C 174,254 156,264 136,268"
          fill="none" stroke="url(#ganeshaGold)" stroke-width="4.2" stroke-linecap="round" />

    <!-- 7. CHANDRA-BINDU (Crescent & Divine Dot at Top Right) -->
    <path d="M 178,110 C 188,112 198,120 204,130 C 198,127 190,122 180,121 C 176,120 174,109 178,110 Z" fill="url(#ganeshaOrange)" />
    <circle cx="198" cy="112" r="5.5" fill="url(#ganeshaOrange)" />
    <circle cx="198" cy="112" r="2.8" fill="url(#ganeshaGold)" />
  </g>
</svg>